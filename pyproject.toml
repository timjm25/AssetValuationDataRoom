[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-valuation-data-room"
version = "0.1.0"
description = "Registry-fed rNPV valuation and diligence data room builder for virtual pharma assets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Tim Maguire" }]
dependencies = [
    "Flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
valuation-room = "valuation_room.cli:main"
valuation-room-api = "valuation_room.api:main"

[tool.setuptools.packages.find]
include = ["valuation_room*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
